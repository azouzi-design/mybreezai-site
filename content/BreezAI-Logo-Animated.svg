<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_2" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 651.55 565.65" width="651.55" height="565.65" overflow="visible">
  <defs>
    <style>
      .swoosh {
        fill: url(#linear-gradient);
        transform-box: fill-box;
        transform-origin: 50% 100%;
        opacity: 0;
        transform: translateY(56px) scale(0.4);
        animation: swoosh-in 1.1s cubic-bezier(0.3, 1.3, 0.4, 1) forwards, float 5s ease-in-out infinite 1.6s;
      }

      .wordmark path {
        fill: #0f2648;
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        transform: translateY(14px);
        animation: glyph-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .wordmark path:nth-child(1) { animation-delay: 0.5s; }
      .wordmark path:nth-child(2) { animation-delay: 0.57s; }
      .wordmark path:nth-child(3) { animation-delay: 0.73s; }
      .wordmark path:nth-child(4) { animation-delay: 0.79s; }
      .wordmark path:nth-child(5) { animation-delay: 0.87s; }
      .wordmark path:nth-child(6) { animation-delay: 0.93s; }

      .shimmer {
        mix-blend-mode: screen;
        transform: translateX(-140%);
        animation: shimmer-sweep 4.2s ease-in-out infinite;
        animation-delay: 2s;
      }

      @keyframes swoosh-in {
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes glyph-in {
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }

      @keyframes shimmer-sweep {
        0%   { transform: translateX(-140%); }
        28%  { transform: translateX(140%); }
        100% { transform: translateX(140%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .swoosh, .wordmark path { animation: none; opacity: 1; transform: none; }
        .shimmer { animation: none; }
      }
    </style>
    <linearGradient id="linear-gradient" x1="308.7" y1="363.19" x2="638.28" y2="31.05" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22769a"/>
      <stop offset="1" stop-color="#6fceea"/>
    </linearGradient>
    <linearGradient id="shimmer-grad" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
