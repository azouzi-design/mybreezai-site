<body>
  <!-- Header Partial -->
  <div id="header-placeholder" style="min-height: 80px;"></div>

  <script>
    fetch('/partials/header.html')
      .then(function (r) { return r.text(); })
      .then(function (html) {
        document.getElementById('header-placeholder').innerHTML = html;
        initializeHeader();
      });

    function initializeHeader() {
      var btn = document.getElementById('mobileMenuBtn');
      var menu = document.getElementById('mobileMenu');
      var dropdownTriggers = document.querySelectorAll('.mobile-menu-dropdown-trigger');
      var menuLinks = document.querySelectorAll('.mobile-menu-link, .mobile-menu-dropdown-items a, .mobile-menu-demo a');

      if (!btn || !menu) return;

      btn.addEventListener('click', function () {
        btn.classList.toggle('active');
        menu.classList.toggle('active');
        document.body.classList.toggle('menu-open');
      });

      dropdownTriggers.forEach(function (trigger) {
        trigger.addEventListener('click', function () {
          trigger.parentElement.classList.toggle('open');
        });
      });

      menuLinks.forEach(function (link) {
        link.addEventListener('click', function () {
          btn.classList.remove('active');
          menu.classList.remove('active');
          document.body.classList.remove('menu-open');
        });
      });

      window.addEventListener('resize', function () {
        if (window.innerWidth > 1000) {
          btn.classList.remove('active');
          menu.classList.remove('active');
          document.body.classList.remove('menu-open');
        }
      });

      // Mark the active nav link based on current URL
      var path = window.location.pathname;
      document.querySelectorAll('.nav-link, .mobile-menu-link').forEach(function (link) {
        if (link.getAttribute('href') === path) {
          link.classList.add('nav-link--active');
        }
      });
    }
  </script>

  <script>
    // Scroll handling for header
    const header = document.getElementById('header');

    const handleScroll = () => {
      const scrollY = window.scrollY;

      if (scrollY > 50) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }
    };

    window.addEventListener('scroll', handleScroll);

    // Reveal on scroll
    const reveals = document.querySelectorAll('.reveal');

    const revealOnScroll = () => {
      reveals.forEach(element => {
        const elementTop = element.getBoundingClientRect().top;
        const windowHeight = window.innerHeight;

        if (elementTop < windowHeight - 100) {
          element.classList.add('visible');
        }
      });
    };

    window.addEventListener('scroll', revealOnScroll);
    window.addEventListener('load', revealOnScroll);
  </script>
