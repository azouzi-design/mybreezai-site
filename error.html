<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Breez AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
        rel="stylesheet">

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" href="/favicon/favicon.ico">
    <link rel="manifest" href="/favicon/site.webmanifest">

    <link rel="stylesheet" href="/styles.css?v=11">
    <link rel="stylesheet" href="/hamburgermenu.css">

    <style>
        :root {
            --orange: #F5A623;
            --orange-light: #F7B24A;
            --orange-dark: #D98216;
            --coral: #E87A3D;
            --peach: #FFD9B3;
            --cream: #FFFBF7;
            --cream-dark: #FFF5EB;
            --warm-gray: #8A7968;
            --text-primary: #3D3428;
            --text-secondary: #6B5D4D;
            --white: #FFFFFF;
            --ink: #2B241C;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--cream);
            color: var(--text-primary);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        .header {
            padding: 0.75rem 2rem;
            background: var(--cream);
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo img {
            height: 70px;
            width: auto;
        }

        /* Error Content */
        .error-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            padding-top: 10rem;
            /* ← add this */
            text-align: center;
        }

        .error-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 2rem;
            position: relative;
        }

        .error-icon-circle {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--peach) 0%, var(--cream-dark) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: gentle-pulse 3s ease-in-out infinite;
        }

        .error-icon-circle svg {
            width: 56px;
            height: 56px;
            color: var(--orange);
        }

        @keyframes gentle-pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .error-code {
            font-family: 'IBM Plex Serif', serif;
            font-size: clamp(4rem, 12vw, 8rem);
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .error-title {
            font-family: 'IBM Plex Serif', serif;
            font-size: clamp(1.5rem, 4vw, 2.25rem);
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }

        .error-message {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 480px;
            margin-bottom: 2.5rem;
        }

        /* Button */
        .btn-home {
            position: relative;
            display: inline-flex;
            align-items: center;
            padding: 0.875rem 1.5rem;
            background: var(--text-primary);
            color: var(--white);
            text-decoration: none;
            border-radius: 100px;
            font-weight: 500;
            font-size: 1rem;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-home:hover {
            box-shadow: 0 8px 25px rgba(61, 52, 40, 0.25);
        }

        .btn-home-bg {
            position: absolute;
            inset: 0;
            background: var(--text-primary);
            border-radius: 100px;
            z-index: 0;
        }

        .btn-home-spotlight {
            position: absolute;
            inset: 0;
            border-radius: 100px;
            opacity: 0;
            background: radial-gradient(circle at 30% 50%,
                    rgba(255, 255, 255, 0.15) 0%,
                    rgba(255, 255, 255, 0.05) 40%,
                    transparent 70%);
            transition: opacity 0.4s ease;
            z-index: 1;
        }

        .btn-home:hover .btn-home-spotlight {
            opacity: 1;
            animation: spotlight-move 0.5s ease forwards;
        }

        @keyframes spotlight-move {
            0% {
                background: radial-gradient(circle at 20% 50%,
                        rgba(255, 255, 255, 0.2) 0%,
                        rgba(255, 255, 255, 0.08) 35%,
                        transparent 60%);
            }

            100% {
                background: radial-gradient(circle at 80% 50%,
                        rgba(255, 255, 255, 0.2) 0%,
                        rgba(255, 255, 255, 0.08) 35%,
                        transparent 60%);
            }
        }

        .btn-home-content {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.625rem;
            z-index: 2;
        }

        .btn-home-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.08) 100%);
            border-radius: 50%;
            flex-shrink: 0;
            transition: background 0.3s ease;
        }

        .btn-home-icon svg {
            width: 16px;
            height: 16px;
            color: var(--white);
            transition: color 0.3s ease;
        }

        .btn-home-text {
            white-space: nowrap;
        }

        .btn-home:hover .btn-home-icon {
            order: 2;
            background: linear-gradient(135deg, rgba(255, 190, 77, 0.35) 0%, rgba(245, 166, 35, 0.25) 100%);
            animation: slide-icon-right 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .btn-home:hover .btn-home-text {
            order: 1;
            animation: slide-text-left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes slide-icon-right {
            0% {
                transform: translateX(calc(-100% - 0.625rem));
                opacity: 0;
            }

            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slide-text-left {
            0% {
                transform: translateX(calc(28px + 0.625rem));
            }

            100% {
                transform: translateX(0);
            }
        }

        .btn-home:hover .btn-home-icon svg {
            color: var(--orange-light);
        }

        /* Footer */
        .footer {
            padding: 2rem;
            background: var(--cream-dark);
        }

        .footer-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer-legal {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .footer-social {
            display: flex;
            gap: 1rem;
        }

        .footer-social a {
            width: 40px;
            height: 40px;
            background: var(--cream);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .footer-social a:hover {
            background: linear-gradient(135deg, var(--orange-light) 0%, var(--orange) 100%);
            color: var(--white);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo img {
                height: 50px;
            }

            .header {
                padding: 0.75rem 1rem;
            }

            .error-icon {
                width: 100px;
                height: 100px;
            }

            .error-icon-circle {
                width: 100px;
                height: 100px;
            }

            .error-icon-circle svg {
                width: 48px;
                height: 48px;
            }

            .footer-inner {
                flex-direction: column;
                text-align: center;
            }

            .error-container {
                padding-top: 7rem;
            }
        }
    </style>
</head>

<body>
    <!-- Header Partial -->
    <div id="header-placeholder" style="min-height: 80px;"></div>

    <script>
        fetch('/partials/header.html')
            .then(function (r) { return r.text(); })
            .then(function (html) {
                document.getElementById('header-placeholder').innerHTML = html;
                initializeHeader();
            });

        function initializeHeader() {
            var btn = document.getElementById('mobileMenuBtn');
            var menu = document.getElementById('mobileMenu');
            var dropdownTriggers = document.querySelectorAll('.mobile-menu-dropdown-trigger');
            var menuLinks = document.querySelectorAll('.mobile-menu-link, .mobile-menu-dropdown-items a, .mobile-menu-demo a');

            if (!btn || !menu) return;

            btn.addEventListener('click', function () {
                btn.classList.toggle('active');
                menu.classList.toggle('active');
                document.body.classList.toggle('menu-open');
            });

            dropdownTriggers.forEach(function (trigger) {
                trigger.addEventListener('click', function () {
                    trigger.parentElement.classList.toggle('open');
                });
            });

            menuLinks.forEach(function (link) {
                link.addEventListener('click', function () {
                    btn.classList.remove('active');
                    menu.classList.remove('active');
                    document.body.classList.remove('menu-open');
                });
            });

            window.addEventListener('resize', function () {
                if (window.innerWidth > 1000) {
                    btn.classList.remove('active');
                    menu.classList.remove('active');
                    document.body.classList.remove('menu-open');
                }
            });

            // Mark the active nav link based on current URL
            var path = window.location.pathname;
            document.querySelectorAll('.nav-link, .mobile-menu-link').forEach(function (link) {
                if (link.getAttribute('href') === path) {
                    link.classList.add('nav-link--active');
                }
            });
        }
    </script>

    <main class="error-container">
        <div class="error-icon">
            <div class="error-icon-circle">
                <svg id="Neutral" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path opacity="0.4"
                        d="M8.28216 3H16.7169C19.665 3 21.5 5.08119 21.5 8.02638V15.9736C21.5 18.9188 19.665 21 16.7159 21H8.28216C5.33405 21 3.5 18.9188 3.5 15.9736V8.02638C3.5 5.08119 5.34281 3 8.28216 3Z"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                    <path d="M14.2842 14.6758H16.9599" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round"></path>
                    <path
                        d="M9.27734 8.97408V8.92252M9.23182 8.76953C9.10782 8.76953 9.00682 8.87053 9.00782 8.99453C9.00782 9.11853 9.10882 9.21953 9.23282 9.21953C9.35682 9.21953 9.45782 9.11853 9.45782 8.99453C9.45782 8.86953 9.35682 8.76953 9.23182 8.76953Z"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                    <path
                        d="M15.7385 8.97408V8.92252M15.7318 8.76953C15.6078 8.76953 15.5068 8.87053 15.5078 8.99453C15.5078 9.11853 15.6088 9.21953 15.7328 9.21953C15.8568 9.21953 15.9578 9.11853 15.9578 8.99453C15.9578 8.86953 15.8568 8.76953 15.7318 8.76953Z"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </div>
        </div>

        <div class="error-code">404</div>
        <h1 class="error-title">Oops! Page not found</h1>
        <p class="error-message">
            The page you're looking for seems to have wandered off. Let's get you back on track.
        </p>

        <a href="/" class="btn-home">
            <span class="btn-home-bg"></span>
            <span class="btn-home-spotlight"></span>
            <span class="btn-home-content">
                <span class="btn-home-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </span>
                <span class="btn-home-text">Back to Home</span>
            </span>
        </a>
    </main>

    <!-- Footer Partial -->
    <div id="footer-placeholder"></div>

    <script>
        fetch('/partials/footer.html')
            .then(function (r) { return r.text(); })
            .then(function (html) {
                document.getElementById('footer-placeholder').innerHTML = html;
            });
    </script>
</body>

</html>
